services:
  - type: web
    name: church-census-api
    runtime: node
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: church-census-db
          property: connectionString
    healthCheckPath: /api/health

databases:
  - name: church-census-db
    databaseName: census_db
    user: census_user
    plan: free
